name: Android Debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Verify APK signature and package
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-info.txt
          grep -q "package: name='com.masu.platochess'" apk-info.txt
          grep -q "launchable-activity: name='com.masu.platochess.MainActivity'" apk-info.txt
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: plato-chess-assistant-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
