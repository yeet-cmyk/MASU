name: Build FRACTURE ZERO APK

on:
  push:
    branches:
      - fracture-zero-apk

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Materialize and patch project
        shell: bash
        run: |
          mkdir -p project
          cat .ci/fracture_payload_1.txt .ci/fracture_payload_2.txt .ci/fracture_payload_3.txt .ci/fracture_payload_4.txt > /tmp/fracture_payload.b64
          base64 -d /tmp/fracture_payload.b64 > /tmp/fracture_zero.zip
          unzip -q /tmp/fracture_zero.zip -d project
          sed -i 's#var mobile := main != null and main.mobile_mode#var mobile: bool = main != null and bool(main.mobile_mode)#' project/scripts/player.gd
          sed -i 's#var move_input := Vector2.ZERO#var move_input: Vector2 = Vector2.ZERO#' project/scripts/player.gd
          sed -i 's#var wants_attack := main.mobile_attack_held if mobile else Input.is_mouse_button_pressed(MOUSE_BUTTON_LEFT)#var wants_attack: bool = bool(main.mobile_attack_held) if mobile else Input.is_mouse_button_pressed(MOUSE_BUTTON_LEFT)#' project/scripts/player.gd
          sed -i 's#var wants_parry := main.consume_mobile_action("parry") if mobile else (Input.is_mouse_button_pressed(MOUSE_BUTTON_RIGHT) or Input.is_key_pressed(KEY_F))#var wants_parry: bool = bool(main.consume_mobile_action("parry")) if mobile else (Input.is_mouse_button_pressed(MOUSE_BUTTON_RIGHT) or Input.is_key_pressed(KEY_F))#' project/scripts/player.gd
          sed -i 's#var wants_dash := main.consume_mobile_action("dash") if mobile else Input.is_key_pressed(KEY_SPACE)#var wants_dash: bool = bool(main.consume_mobile_action("dash")) if mobile else Input.is_key_pressed(KEY_SPACE)#' project/scripts/player.gd
          sed -i 's#var wants_shift := main.consume_mobile_action("shift") if mobile else Input.is_key_pressed(KEY_Q)#var wants_shift: bool = bool(main.consume_mobile_action("shift")) if mobile else Input.is_key_pressed(KEY_Q)#' project/scripts/player.gd
          sed -i 's#var wants_burst := main.consume_mobile_action("burst") if mobile else Input.is_key_pressed(KEY_E)#var wants_burst: bool = bool(main.consume_mobile_action("burst")) if mobile else Input.is_key_pressed(KEY_E)#' project/scripts/player.gd
          sed -i 's#var c := main.phase_color() if main else Color("31d9ff")#var c: Color = main.phase_color() if main else Color("31d9ff")#' project/scripts/player.gd
          sed -i 's#var base := (main.player.position-position).angle()#var base: float = (main.player.position-position).angle()#' project/scripts/boss.gd
          sed -i 's#var a := base + lerp(-spread, spread, f)#var a: float = base + lerp(-spread, spread, f)#' project/scripts/boss.gd
          printf '%s\n\n%s\n' '[gd_resource type="AudioBusLayout" format=3]' '[resource]' > project/default_bus_layout.tres
          unzip -t /tmp/fracture_zero.zip

      - name: Prepare Godot Android environment
        shell: bash
        run: |
          export HOME=/root
          godot --version
          test -f /root/.local/share/godot/export_templates/4.3.stable/android_debug.apk
          test -d /usr/lib/android-sdk
          test -d /usr/lib/jvm/java-17-openjdk-amd64
          test -f /root/debug.keystore
          mkdir -p /root/.config/godot
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' \
            'export/android/android_sdk_path = "/usr/lib/android-sdk"' \
            'export/android/debug_keystore = "/root/debug.keystore"' \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            'export/android/force_system_user = false' \
            'export/android/timestamping_authority_url = ""' \
            'export/android/shutdown_adb_on_exit = true' \
            > /root/.config/godot/editor_settings-4.3.tres
          cat /root/.config/godot/editor_settings-4.3.tres

      - name: Import project and validate scripts
        shell: bash
        run: |
          export HOME=/root
          godot --headless --path project --import 2>&1 | tee /tmp/import.log
          if grep -q "SCRIPT ERROR: Parse Error" /tmp/import.log; then
            exit 1
          fi

      - name: Export debug APK
        shell: bash
        run: |
          export HOME=/root
          mkdir -p project/build
          godot --headless --verbose --path project --export-debug "Android" "$GITHUB_WORKSPACE/project/build/FRACTURE_ZERO.apk"
          test -s project/build/FRACTURE_ZERO.apk
          ls -lh project/build/FRACTURE_ZERO.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRACTURE_ZERO_APK
          path: project/build/FRACTURE_ZERO.apk
          if-no-files-found: error
