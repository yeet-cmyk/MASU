name: Build FRACTURE ZERO APK

on:
  push:
    branches:
      - fracture-zero-apk

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Materialize project
        shell: bash
        run: |
          mkdir -p project
          cat .ci/fracture_payload_1.txt .ci/fracture_payload_2.txt .ci/fracture_payload_3.txt .ci/fracture_payload_4.txt > /tmp/fracture_payload.b64
          base64 -d /tmp/fracture_payload.b64 > /tmp/fracture_zero.zip
          unzip -q /tmp/fracture_zero.zip -d project
          cd project
          if command -v python3 >/dev/null 2>&1; then
            python3 generate_audio.py
          fi
          ls -la
          unzip -t /tmp/fracture_zero.zip

      - name: Prepare Godot templates
        shell: bash
        run: |
          mkdir -p /root/.local/share/godot/export_templates
          if [ -d /root/.local/share/godot/templates/4.3.stable ] && [ ! -d /root/.local/share/godot/export_templates/4.3.stable ]; then
            mv /root/.local/share/godot/templates/4.3.stable /root/.local/share/godot/export_templates/
          fi
          godot --version
          ls -la /root/.local/share/godot/export_templates || true
          ls -la /usr/lib/android-sdk || true

      - name: Import project
        shell: bash
        run: |
          godot --headless --path project --import

      - name: Export debug APK
        shell: bash
        run: |
          mkdir -p project/build
          godot --headless --verbose --path project --export-debug "Android" "$GITHUB_WORKSPACE/project/build/FRACTURE_ZERO.apk"
          test -f project/build/FRACTURE_ZERO.apk
          ls -lh project/build/FRACTURE_ZERO.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRACTURE_ZERO_APK
          path: project/build/FRACTURE_ZERO.apk
          if-no-files-found: error
